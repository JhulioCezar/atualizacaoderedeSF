<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sem Fronteiras - Formulários</title>

    <link rel="icon" type="image/png" href="android-icon-192x192.png"> 
    
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="android-icon-512x512.png">
    
    <link rel="manifest" href="manifest.json"> 

    <style>
        /* Estilos gerais e de fundo */
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #007bff 0%, #00c6ff 100%);
            background-attachment: fixed;
            min-height: 100vh; 
            position: relative; 
            padding-bottom: 40px;
            font-size: 16px; 
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.2); 
            padding: 25px;
            position: relative;
        }
        /* ESTILO: Logomarca */
        .logo {
            display: block;
            width: 80%; 
            max-width: 350px;
            height: auto;
            margin: 0 auto 10px auto; 
        }
        /* Ajuste de margem do Título do Formulário */
        #form-screen .logo-header {
             margin-bottom: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 0; 
            font-size: 1.5em; 
        }
        h3 {
            margin-top: 5px;
            margin-bottom: 15px;
            color: #555;
            font-size: 1.2em;
        }
        .hidden {
            display: none;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            font-size: 1em; 
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 6px; 
            box-sizing: border-box;
        }
        
        /* Container para o campo de coordenada e botão de busca */
        .input-group {
            display: flex;
            margin-top: 4px;
            flex-wrap: wrap; 
        }
        
        /* INPUT DENTRO DO INPUT-GROUP (Desktop) */
        .input-group input {
            flex-grow: 1;
            margin-top: 0;
            border-radius: 6px; 
            border-right: 1px solid #ccc;
            margin-right: 5px; 
        }
        
        .input-group button {
            margin-top: 0;
            padding: 0 15px;
            height: 36.8px; 
            border-radius: 6px; 
            flex-shrink: 0;
            margin-right: 5px; 
        }
        
        .input-group button:last-child {
            margin-right: 0;
        }

        .gps-button {
            background-color: #ff9800 !important;
            padding: 0 10px;
        }

        input:read-only {
            background-color: #f0f0f0;
            cursor: default;
        }
        input.link-field {
            cursor: pointer;
            color: #007bff;
            text-decoration: underline;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: inner-spin-button;
            margin: 0;
        }
        .button-group {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        button {
            margin-top: 15px;
            padding: 10px 15px;
            border: none;
            background-color: #007bff;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em; 
            transition: 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .action-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .limpar {
            background-color: #dc3545;
        }
        .limpar:hover {
            background-color: #a71d2a;
        }
        .validar {
            background-color: #17a2b8;
        }
        .validar:hover {
            background-color: #138496;
        }
        .mensagem {
            display: none;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 10;
            animation: fadeInOut 2.5s;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; top: -20px; }
            10% { opacity: 1; top: 10px; }
            90% { opacity: 1; top: 10px; }
            100% { opacity: 0; top: -20px; }
        }
        
        .back-button {
            position: absolute;
            top: 25px;
            left: 25px;
            background: #6c757d;
            z-index: 5; 
        }
        .back-button:hover {
            background: #5a6268;
        }

        #home-buttons {
            margin-top: 60px;
        }
        #home-buttons button {
            width: 45%;
            padding: 20px;
            font-size: 1.2em; 
        }

        .footer {
            position: absolute;
            right: 20px;
            bottom: 10px;
            color: #fff;
            font-size: 0.8em; 
            font-weight: bold;
        }

        /* Estilo para o alerta customizado */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .modal-content h3 {
            color: #dc3545;
            margin-top: 0;
        }
        
        .modal-content p {
            margin: 15px 0;
            line-height: 1.5;
        }
        
        .modal-content button {
            margin: 10px;
            min-width: 100px;
        }
        
        .modal-content .btn-confirmar {
            background-color: #28a745;
        }
        
        .modal-content .btn-cancelar {
            background-color: #dc3545;
        }

        .status-indicator {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .status-valido {
            background-color: #28a745;
            color: white;
        }
        
        .status-invalido {
            background-color: #dc3545;
            color: white;
        }
        
        .status-verificando {
            background-color: #ffc107;
            color: black;
        }

        /* Estilo para o painel de usuário */
        .user-panel {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .user-info select {
            flex: 2;
            min-width: 200px;
        }
        
        .user-info button {
            margin-top: 0;
            padding: 8px 12px;
        }
        
        .add-user-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
        }
        
        .add-user-input input {
            flex: 2;
            margin-top: 0;
        }
        
        .small-button {
            background-color: #6c757d;
            padding: 8px 12px;
            font-size: 0.9em;
        }

        .motivo-field {
            margin-top: 15px;
        }
        
        /* --- MEDIA QUERY PARA CELULARES --- */
        @media (max-width: 500px) {
            .container {
                padding: 15px; 
            }
            .back-button {
                position: static; 
                display: block;
                width: 100%;
                margin: 0 0 15px 0; 
            }
            #form-screen .logo-header {
                margin-top: 15px;
            }
            
            .input-group {
                flex-wrap: wrap; 
            }
            .input-group input {
                width: 100%;
                flex-basis: 100%; 
                margin-bottom: 5px;
                margin-right: 0;
            }
            
            .input-group button {
                flex-basis: 48%; 
                height: auto;
                padding: 8px;
                margin-right: 0;
            }
            
            .input-group:has(button:nth-child(3)) button:nth-child(2) {
                 margin-right: 5px; 
            }
            
            .input-group:has(button:only-child) button:only-child {
                flex-basis: 100%;
            }
            
            .user-info {
                flex-direction: column;
                align-items: stretch;
            }
            
            .user-info select {
                width: 100%;
            }
        }
    </style>
</head>

    <script>
        // CONFIGURAÇÃO - COLE SUA URL DO APPS SCRIPT AQUI
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwKnswKrS3VtffoqYw2hPKGCvb5ksrvpzB-2jFN7OPGPCTWcMoySaELGsesQqFGbJBFeg/exec';
        
        const oltMap = {
            "FTTH Albert Sampaio": "Cidade do Povo",
            "FTTH Assis Brasil": "Assis Brasil",
            "FTTH Benfica": "Benfica",
            "FTTH Bujari": "Bujari",
            "FTTH Canaã": "Canaã",
            "FTTH Cidade do Povo": "Cidade do Povo",
            "FTTH Maison Borges": "Maison Borges/Alphaville Custódio",
            "FTTH Município do Quinari": "Quinari",
            "FTTH Ouricuri": "Ouricuri",
            "FTTH Parte Alta 2": "Parte Alta",
            "FTTH Primeiro Distrito Data Center VLG": "Parte Alta",
            "FTTH Primeiro Distrito Esperança": "Esperança/Calafate",
            "FTTH Primeiro Distrito Sobral": "Sobral/XGPON",
            "FTTH Primeiro Distrito XGPON": "XGPON",
            "FTTH Segundo Distrito Belo Jardim": "Segundo Distrito",
            "FTTH Segundo Distrito Bom Jesus": "Bom Jesus",
            "FTTH Sena Madureira": "Sena Madureira",
            "FTTH Tancredo Neves": "Parte Alta",
            "FTTH Taquari": "Segundo Distrito",
            "FTTH Xavier Maia": "Parte Alta"
        };

        let idPendente = null;
        let dadosPendentes = null;
        let usuarioAtual = '';

        // Lista de usuários (inicia com valores padrão)
        let usuarios = ['Jhulio Cezar', 'Kaio Cezar'];

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // Funções para gerenciar usuários
        function carregarUsuarios() {
            const select = document.getElementById('usuarioSelect');
            select.innerHTML = '<option value="">Selecione um usuário</option>';
            
            usuarios.forEach(usuario => {
                const option = document.createElement('option');
                option.value = usuario;
                option.textContent = usuario;
                select.appendChild(option);
            });
        }

        function abrirModalAdicionarUsuario() {
            document.getElementById('addUserModal').style.display = 'flex';
            document.getElementById('newUserName').value = '';
        }

        function fecharAddUserModal() {
            document.getElementById('addUserModal').style.display = 'none';
        }

        function adicionarUsuario() {
            const novoUsuario = document.getElementById('newUserName').value.trim();
            
            if (!novoUsuario) {
                mostrarMensagem('Digite um nome para o usuário', 'erro');
                return;
            }
            
            if (usuarios.includes(novoUsuario)) {
                mostrarMensagem('Usuário já existe!', 'erro');
                return;
            }
            
            usuarios.push(novoUsuario);
            carregarUsuarios();
            fecharAddUserModal();
            mostrarMensagem(`Usuário ${novoUsuario} adicionado com sucesso!`, 'sucesso');
            
            // Selecionar o novo usuário automaticamente
            document.getElementById('usuarioSelect').value = novoUsuario;
            atualizarUsuarioSelecionado();
        }

        function atualizarUsuarioSelecionado() {
            const select = document.getElementById('usuarioSelect');
            usuarioAtual = select.value;
            
            const infoDiv = document.getElementById('usuarioSelecionadoInfo');
            const nomeSpan = document.getElementById('usuarioNomeExibido');
            
            if (usuarioAtual) {
                nomeSpan.textContent = usuarioAtual;
                infoDiv.style.display = 'block';
            } else {
                infoDiv.style.display = 'none';
            }
        }

        // Funções para gerenciar motivos
        function atualizarMotivoImplantacao() {
            const select = document.getElementById('motivoSelectImplantacao');
            const outroTextarea = document.getElementById('motivoOutroImplantacao');
            const motivoFinal = document.getElementById('motivoFinalImplantacao');
            
            if (select.value === 'Outro (especificar)') {
                outroTextarea.style.display = 'block';
                motivoFinal.value = '';
            } else {
                outroTextarea.style.display = 'none';
                motivoFinal.value = select.value;
            }
        }

        function atualizarMotivoAmpliacao() {
            const select = document.getElementById('motivoSelectAmpliacao');
            const outroTextarea = document.getElementById('motivoOutroAmpliacao');
            const motivoFinal = document.getElementById('motivoFinalAmpliacao');
            
            if (select.value === 'Outro (especificar)') {
                outroTextarea.style.display = 'block';
                motivoFinal.value = '';
            } else {
                outroTextarea.style.display = 'none';
                motivoFinal.value = select.value;
            }
        }

        function getMotivoFinal(tipo) {
            const select = document.getElementById(`motivoSelect${capitalize(tipo)}`);
            const outroTextarea = document.getElementById(`motivoOutro${capitalize(tipo)}`);
            const motivoFinal = document.getElementById(`motivoFinal${capitalize(tipo)}`);
            
            if (select.value === 'Outro (especificar)') {
                return outroTextarea.value.trim() || 'Não especificado';
            } else {
                return select.value || 'Não especificado';
            }
        }

        function showScreen(screenType) {
            const home = document.getElementById("home-screen");
            const formScreen = document.getElementById("form-screen");
            const backBtn = document.getElementById("back-btn");

            if (screenType === 'home') {
                home.classList.remove("hidden");
                formScreen.classList.add("hidden");
                backBtn.classList.add("hidden"); 
            } else if (screenType === 'form') {
                home.classList.add("hidden");
                formScreen.classList.remove("hidden");
                backBtn.classList.remove("hidden");
            }
        }

        function showForm(type) {
            showScreen('form');
            
            document.getElementById("implantacao").classList.add("hidden");
            document.getElementById("ampliacao").classList.add("hidden");
            
            document.getElementById(type).classList.remove("hidden");

            const titulo = document.getElementById("titulo");
            titulo.textContent = type === "implantacao" ? "Formulário de Implantação" : "Formulário de Ampliação";
            
            setAddressFieldsEditable(type, true);
            setCoordenadasEditable(type, true);
            
            // Resetar status do ID
            if (type === 'ampliacao') {
                const statusSpan = document.getElementById('statusId');
                statusSpan.style.display = 'none';
                statusSpan.className = 'status-indicator';
            }
        }

        function atualizarOLT(formType) {
            const projetoSelect = document.getElementById(`projeto${capitalize(formType)}`);
            const oltField = document.getElementById(`olt${capitalize(formType)}`);
            oltField.value = oltMap[projetoSelect.value] || "";
        }
        
        function abrirLink(tipo) {
            const link = document.getElementById(`localizacao${capitalize(tipo)}`).value;
            if (link && (link.startsWith('http://') || link.startsWith('https://'))) {
                window.open(link, '_blank');
            } else {
                mostrarMensagem("Link de Localização inválido ou não disponível.", 'erro');
            }
        }

        function buscarPorLocalizacaoAtual(tipo) {
            mostrarMensagem("Aguardando localização GPS...", 'sucesso');
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const coordenadas = `${lat}, ${lon}`;

                        document.getElementById(`coordenadas${capitalize(tipo)}`).value = coordenadas;
                        geocodificarCoordenadas(tipo);
                    },
                    (error) => {
                        let msgErro = "Erro ao obter localização. Verifique as permissões de GPS.";
                        if (error.code === 1) {
                            msgErro = "Acesso à localização negado. Por favor, permita o uso do GPS nas configurações do seu aparelho/navegador.";
                        }
                        mostrarMensagem(msgErro, 'erro');
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 5000,
                        maximumAge: 0
                    }
                );
            } else {
                mostrarMensagem("Geolocalização não suportada neste navegador/aparelho.", 'erro');
            }
        }

        function setAddressFieldsEditable(tipo, editable) {
            const endereco = document.getElementById(`endereco${capitalize(tipo)}`);
            const localizacao = document.getElementById(`localizacao${capitalize(tipo)}`);
            
            endereco.readOnly = !editable;
            localizacao.readOnly = !editable;
            
            localizacao.classList.toggle('link-field', !editable); 
        }

        function setCoordenadasEditable(tipo, editable) {
            const coordenadas = document.getElementById(`coordenadas${capitalize(tipo)}`);
            coordenadas.readOnly = !editable;
        }

        async function geocodificarCoordenadas(tipo) {
            const coordenadasInput = document.getElementById(`coordenadas${capitalize(tipo)}`).value.trim();
            
            preencherCamposEndereco(tipo, "", "Link não disponível.");
            setAddressFieldsEditable(tipo, true);
            setCoordenadasEditable(tipo, true);

            if (!coordenadasInput) {
                mostrarMensagem("Insira as coordenadas antes de buscar.", 'erro');
                return;
            }

            const partes = coordenadasInput.replace(/,/g, ' ').split(/\s+/).filter(p => p);
            
            if (partes.length < 2 || isNaN(parseFloat(partes[0])) || isNaN(parseFloat(partes[1]))) {
                mostrarMensagem("Formato de coordenadas inválido. Permita a digitação manual.", 'erro');
                return;
            }

            const lat = parseFloat(partes[0]);
            const lon = parseFloat(partes[1]);
            
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;
            
            try {
                const response = await fetch(url, {
                    headers: {
                        'User-Agent': 'FormularioImplatacaoAmpliacao/1.0' 
                    }
                });
                const data = await response.json();

                if (response.ok && data.address) {
                    
                    const addr = data.address;
                    const rua = addr.road || addr.footway || addr.pedestrian || addr.path || 'Rua/Via desconhecida';
                    const numero = addr.house_number || '';
                    const cidade = addr.city || addr.town || addr.municipality || '';
                    const estado = addr.state_abbr || addr.state || '';
                    const cep = addr.postcode || '';
                    const pais = addr.country || '';

                    let enderecoCompleto = `${rua}`;
                    if (numero) enderecoCompleto += `, ${numero}`;
                    if (cidade && estado) {
                        enderecoCompleto += `, ${cidade} - ${estado}`;
                    } else if (cidade) {
                        enderecoCompleto += `, ${cidade}`;
                    } else if (estado) {
                        enderecoCompleto += `, ${estado}`;
                    }
                    if (cep) enderecoCompleto += `, CEP: ${cep}`;
                    if (pais) enderecoCompleto += `, ${pais}`;
                    
                    enderecoCompleto = enderecoCompleto.replace(/^,\s*/, '').trim();

                    const localizacaoLink = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;

                    preencherCamposCoordenada(tipo, `${lat}, ${lon}`); 
                    preencherCamposEndereco(tipo, enderecoCompleto, localizacaoLink);
                    
                    setAddressFieldsEditable(tipo, false);
                    setCoordenadasEditable(tipo, false);
                    mostrarMensagem("Endereço e Link de Localização preenchidos automaticamente.");

                } else {
                    console.error('Geocodificação Reversa falhou:', data);
                    mostrarMensagem("Não foi possível encontrar o endereço. Digite manualmente.", 'erro');
                    
                    setAddressFieldsEditable(tipo, true);
                    setCoordenadasEditable(tipo, true);
                }

            } catch (error) {
                console.error('Erro na requisição Nominatim:', error);
                mostrarMensagem("Erro de conexão. Digite o endereço e localização manualmente.", 'erro');
                setAddressFieldsEditable(tipo, true);
                setCoordenadasEditable(tipo, true);
            }
        }
        
        async function geocodificarEndereco(tipo) {
            let enderecoInput = document.getElementById(`endereco${capitalize(tipo)}`).value.trim();
            const enderecoOriginal = enderecoInput; 
            
            preencherCamposCoordenada(tipo, ""); 
            preencherCamposEndereco(tipo, enderecoOriginal, "Link não disponível.");
            setAddressFieldsEditable(tipo, true);
            setCoordenadasEditable(tipo, true);

            if (!enderecoInput) {
                mostrarMensagem("Insira um endereço antes de buscar.", 'erro');
                return;
            }

            enderecoInput = enderecoInput.replace(/(,\s*|)\s*CEP\s*[:\s]*[\d\-]{6,9}/gi, ''); 
            enderecoInput = enderecoInput.replace(/(,\s*|)\s*(Brasil|Brazil)\s*$/gi, '').trim(); 
            enderecoInput = enderecoInput.replace(/\s+/g, ' ').replace(/,,\s*/g, ', ').trim();

            const query = encodeURIComponent(enderecoInput);
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=1`;

            try {
                const response = await fetch(url, {
                    headers: {
                        'User-Agent': 'FormularioImplatacaoAmpliacao/1.0'
                    }
                });
                const data = await response.json();

                if (response.ok && data.length > 0) {
                    const resultado = data[0];
                    const lat = resultado.lat;
                    const lon = resultado.lon;
                    const coordenadas = `${lat}, ${lon}`;
                    
                    const localizacaoLink = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
                    
                    preencherCamposCoordenada(tipo, coordenadas); 
                    preencherCamposEndereco(tipo, enderecoOriginal, localizacaoLink); 
                    
                    setAddressFieldsEditable(tipo, false);
                    setCoordenadasEditable(tipo, false);
                    mostrarMensagem("Coordenadas e Link de Localização preenchidos pelo endereço.");

                } else {
                    console.error('Geocodificação de Endereço falhou:', data);
                    mostrarMensagem("Endereço não encontrado. Por favor, ajuste a digitação.", 'erro');
                }

            } catch (error) {
                console.error('Erro na requisição Nominatim:', error);
                mostrarMensagem("Erro de conexão ao buscar endereço. Tente novamente.", 'erro');
            }
        }

        function preencherCamposEndereco(tipo, endereco, localizacao) {
            document.getElementById(`endereco${capitalize(tipo)}`).value = endereco;
            document.getElementById(`localizacao${capitalize(tipo)}`).value = localizacao;
        }
        
        function preencherCamposCoordenada(tipo, coordenadas) {
            document.getElementById(`coordenadas${capitalize(tipo)}`).value = coordenadas;
        }

        // FUNÇÕES DE INTEGRAÇÃO COM GOOGLE SHEETS
        
        async function verificarIdAmpliacao() {
            const id = document.getElementById('idAmpliacao').value.trim();
            const statusSpan = document.getElementById('statusId');
            
            if (!id) {
                statusSpan.style.display = 'none';
                return null;
            }
            
            statusSpan.style.display = 'inline-block';
            statusSpan.className = 'status-indicator status-verificando';
            statusSpan.textContent = 'Verificando...';
            
            try {
                const url = `${APPS_SCRIPT_URL}?action=verificar&id=${encodeURIComponent(id)}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success) {
                    if (data.existe) {
                        statusSpan.className = 'status-indicator status-invalido';
                        statusSpan.textContent = '❌ ID já cadastrado';
                        
                        // Mostrar modal de confirmação
                        const modalMessage = document.getElementById('modalMessage');
                        
                        // Data já vem formatada do Apps Script como DD/MM/AAAA
                        const dataFormatada = data.data || 'data não disponível';
                        
                        modalMessage.innerHTML = `O ID <strong>${id}</strong> já tem O.S cadastrada no dia <strong>${dataFormatada}</strong> por <strong>${data.responsavel || 'responsável não informado'}</strong> para o projeto <strong>${data.projeto || 'projeto não informado'}</strong>.<br><br>Deseja continuar mesmo assim?`;
                        
                        document.getElementById('confirmModal').style.display = 'flex';
                        idPendente = id;
                        
                        return {
                            existe: true,
                            data: data
                        };
                    } else {
                        statusSpan.className = 'status-indicator status-valido';
                        statusSpan.textContent = '✅ ID disponível';
                        return {
                            existe: false
                        };
                    }
                } else {
                    statusSpan.style.display = 'none';
                    mostrarMensagem('Erro ao verificar ID: ' + (data.error || 'erro desconhecido'), 'erro');
                    return null;
                }
            } catch (error) {
                console.error('Erro na verificação:', error);
                statusSpan.style.display = 'none';
                mostrarMensagem('Erro de conexão ao verificar ID', 'erro');
                return null;
            }
        }
        
        function validarEConfirmarAmpliacao() {
            const id = document.getElementById('idAmpliacao').value.trim();
            
            if (!id) {
                mostrarMensagem('Por favor, digite um ID para validar', 'erro');
                return;
            }
            
            verificarIdAmpliacao();
        }
        
        function confirmarContinuar(continuar) {
            document.getElementById('confirmModal').style.display = 'none';
            
            if (continuar && dadosPendentes) {
                // Usuário optou por continuar mesmo com ID duplicado
                processarGeracaoAmpliacao(dadosPendentes);
            } else if (continuar && idPendente) {
                // Recuperar dados do formulário
                const dados = {
                    id: idPendente,
                    endereco: document.getElementById('enderecoAmpliacao').value,
                    coordenadas: document.getElementById('coordenadasAmpliacao').value,
                    localizacao: document.getElementById('localizacaoAmpliacao').value,
                    quantidade: document.getElementById('quantidadeAmpliacao').value,
                    projeto: document.getElementById('projetoAmpliacao').value,
                    olt: document.getElementById('oltAmpliacao').value,
                    responsavel: usuarioAtual,
                    motivo: getMotivoFinal('ampliacao')
                };
                processarGeracaoAmpliacao(dados);
            }
            
            idPendente = null;
            dadosPendentes = null;
        }
        
        async function processarGeracaoAmpliacao(dados) {
            const texto = `Dados da Ampliação\n\n` +
                `Endereço: ${dados.endereco}\n\n` +
                `Localização: ${dados.localizacao}\n\n` +
                `Coordenadas: ${dados.coordenadas}\n\n` +
                `Quantidade: ${dados.quantidade}\n\n` +
                `ID: ${dados.id}\n\n` +
                `Projeto: ${dados.projeto}\n\n` +
                `OLT: ${dados.olt}\n\n` +
                `Responsável: ${dados.responsavel}\n\n` +
                `Motivo: ${dados.motivo}\n\n`;

            // Copiar para área de transferência
            navigator.clipboard.writeText(texto);
            mostrarMensagem("As informações foram copiadas com sucesso!");
            
            // Salvar no Google Sheets
            await salvarAmpliacaoNoSheet(dados);
        }
        
        async function salvarAmpliacaoNoSheet(dados) {
            try {
                const formData = new URLSearchParams();
                formData.append('action', 'salvar');
                formData.append('id', dados.id);
                formData.append('endereco', dados.endereco);
                formData.append('coordenadas', dados.coordenadas);
                formData.append('localizacao', dados.localizacao);
                formData.append('quantidade', dados.quantidade);
                formData.append('projeto', dados.projeto);
                formData.append('olt', dados.olt);
                formData.append('responsavel', dados.responsavel);
                formData.append('motivo', dados.motivo);
                
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    mostrarMensagem('✅ Chamado salvo com sucesso na planilha!', 'sucesso');
                    return true;
                } else {
                    mostrarMensagem('❌ Erro ao salvar: ' + data.error, 'erro');
                    return false;
                }
            } catch (error) {
                console.error('Erro ao salvar:', error);
                mostrarMensagem('❌ Erro de conexão ao salvar', 'erro');
                return false;
            }
        }

        function gerarTexto(tipo) {
            // Verificar se usuário está selecionado
            if (!usuarioAtual) {
                mostrarMensagem("Por favor, selecione um usuário antes de gerar!", 'erro');
                return;
            }

            if (tipo === "implantacao") {
                const motivo = getMotivoFinal('implantacao');
                
                let texto = "";
                texto += `Dados da Implantação\n\n`;
                texto += `Endereço: ${document.getElementById("enderecoImplantacao").value}\n\n`;
                texto += `Localização: ${document.getElementById("localizacaoImplantacao").value}\n\n`;
                texto += `Coordenadas: ${document.getElementById("coordenadasImplantacao").value}\n\n`;
                texto += `Quantidade: ${document.getElementById("quantidadeImplantacao").value}\n\n`;
                texto += `ID: ${document.getElementById("idImplantacao").value}\n\n`;
                texto += `Projeto: ${document.getElementById("projetoImplantacao").value}\n\n`;
                texto += `OLT: ${document.getElementById("oltImplantacao").value}\n\n`;
                texto += `Responsável: ${usuarioAtual}\n\n`;
                texto += `Motivo: ${motivo}\n\n`;

                // Validação de campos obrigatórios
                const coords = document.getElementById("coordenadasImplantacao").value;
                const address = document.getElementById("enderecoImplantacao").value;
                const link = document.getElementById("localizacaoImplantacao").value;
                const quantidade = document.getElementById("quantidadeImplantacao").value;
                const id = document.getElementById("idImplantacao").value;
                const projeto = document.getElementById("projetoImplantacao").value;

                if (!coords || !address || !link || !quantidade || !id || !projeto) {
                    mostrarMensagem("Preencha todos os campos obrigatórios antes de gerar.", 'erro');
                    return;
                }

                if (!motivo || motivo === 'Não especificado') {
                    mostrarMensagem("Por favor, selecione ou digite um motivo válido.", 'erro');
                    return;
                }

                navigator.clipboard.writeText(texto);
                mostrarMensagem("As informações foram copiadas com sucesso!");
                
            } else {
                // Ampliação
                const id = document.getElementById("idAmpliacao").value.trim();
                const coords = document.getElementById("coordenadasAmpliacao").value;
                const address = document.getElementById("enderecoAmpliacao").value;
                const link = document.getElementById("localizacaoAmpliacao").value;
                const quantidade = document.getElementById("quantidadeAmpliacao").value;
                const projeto = document.getElementById("projetoAmpliacao").value;
                const motivo = getMotivoFinal('ampliacao');

                // Validar campos obrigatórios
                if (!id || !coords || !address || !link || !quantidade || !projeto) {
                    mostrarMensagem("Preencha todos os campos obrigatórios antes de gerar.", 'erro');
                    return;
                }

                if (!motivo || motivo === 'Não especificado') {
                    mostrarMensagem("Por favor, selecione ou digite um motivo válido.", 'erro');
                    return;
                }

                // Verificar ID primeiro
                verificarIdAmpliacao().then(resultado => {
                    if (resultado && resultado.existe) {
                        // O modal já será mostrado pela função verificarIdAmpliacao
                        // Aguardar resposta do modal
                        dadosPendentes = {
                            id, 
                            endereco: address, 
                            coordenadas: coords, 
                            localizacao: link, 
                            quantidade, 
                            projeto,
                            olt: document.getElementById("oltAmpliacao").value,
                            responsavel: usuarioAtual,
                            motivo
                        };
                        return;
                    }

                    // Se não existe ou é novo, prosseguir
                    const dados = {
                        id,
                        endereco: address,
                        coordenadas: coords,
                        localizacao: link,
                        quantidade,
                        projeto,
                        olt: document.getElementById("oltAmpliacao").value,
                        responsavel: usuarioAtual,
                        motivo
                    };
                    
                    processarGeracaoAmpliacao(dados);
                });
            }
        }

        function limparFormulario(tipo) {
            const form = document.getElementById(tipo);
            form.reset();
            
            const oltField = document.getElementById(`olt${capitalize(tipo)}`);
            if (oltField) oltField.value = "";

            setAddressFieldsEditable(tipo, true); 
            setCoordenadasEditable(tipo, true);
            
            if (tipo === 'ampliacao') {
                // Resetar status do ID
                const statusSpan = document.getElementById('statusId');
                statusSpan.style.display = 'none';
                statusSpan.className = 'status-indicator';
            }
            
            // Resetar campos de motivo
            if (tipo === 'implantacao') {
                document.getElementById('motivoOutroImplantacao').style.display = 'none';
                document.getElementById('motivoOutroImplantacao').value = '';
                document.getElementById('motivoFinalImplantacao').value = '';
            } else {
                document.getElementById('motivoOutroAmpliacao').style.display = 'none';
                document.getElementById('motivoOutroAmpliacao').value = '';
                document.getElementById('motivoFinalAmpliacao').value = '';
            }
            
            mostrarMensagem("Formulário limpo com sucesso!");
        }

        function mostrarMensagem(texto, tipo = 'sucesso') {
            const msg = document.getElementById("mensagem");
            msg.textContent = texto;

            if (tipo === 'erro') {
                msg.style.backgroundColor = '#dc3545';
            } else {
                msg.style.backgroundColor = '#28a745';
            }

            msg.style.display = "block";
            
            msg.style.animation = 'none';
            void msg.offsetWidth;
            msg.style.animation = 'fadeInOut 2.5s';

            setTimeout(() => {
                msg.style.display = "none";
            }, 2500);
        }

        // Fechar modal se clicar fora
        window.onclick = function(event) {
            const confirmModal = document.getElementById('confirmModal');
            const addUserModal = document.getElementById('addUserModal');
            
            if (event.target === confirmModal) {
                confirmModal.style.display = 'none';
                idPendente = null;
                dadosPendentes = null;
            }
            
            if (event.target === addUserModal) {
                addUserModal.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            showScreen('home'); 
            setAddressFieldsEditable('implantacao', true);
            setAddressFieldsEditable('ampliacao', true);
            setCoordenadasEditable('implantacao', true);
            setCoordenadasEditable('ampliacao', true);
            
            // Carregar usuários
            carregarUsuarios();
            
            // REGISTRO DO SERVICE WORKER
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('service-worker.js')
                        .then(registration => {
                            console.log('Service Worker registrado com sucesso:', registration.scope);
                        })
                        .catch(error => {
                            console.log('Falha no registro do Service Worker:', error);
                        });
                });
            }
        });
    </script>
